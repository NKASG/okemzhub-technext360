# Temporary diagnostic: checks the Worker and the domain from outside.
name: Diagnose Cloudflare Worker
on:
  push:
    branches: [Cloudflare]
    paths: [.github/workflows/diagnose-worker.yml]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          for d in okemztech360.com www.okemztech360.com app.okemztech360.com; do
            ns=$(dig +short NS "${d#www.}" | tr '\n' ' '); a=$(dig +short "$d" | tr '\n' ' ')
            echo "::notice title=DNS $d::NS=[$ns] A=[$a]"
          done
          probe() {
            r=$(curl -s -m 60 -o body.txt -w "HTTP %{http_code} in %{time_total}s" "${@:3}" "$2" || echo "curl failed")
            b=$(head -c 200 body.txt | tr -s '\n\r' '  ')
            echo "::notice title=$1 $2::$r :: $b"
          }
          W=https://okemzhub-technext360.mohafeezola.workers.dev
          for i in 1 2 3; do
            probe GET $W/health
            probe POST $W/auth/token -X POST -d "username=zz-diagnostic-not-a-user&password=x"
          done
          probe GET https://okemztech360.com/health
          probe GET https://www.okemztech360.com/health
