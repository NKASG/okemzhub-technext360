# Temporary diagnostic: checks the Cloudflare Worker from outside.
name: Diagnose Cloudflare Worker
on:
  push:
    branches: [Cloudflare]
    paths: [.github/workflows/diagnose-worker.yml]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Probe the Worker
        run: |
          B=https://okemzhub-technext360.mohafeezola.workers.dev
          probe() {
            echo "=== $1 $2"
            curl -s -m 60 -o body.txt -w "HTTP %{http_code} in %{time_total}s\n" "${@:3}" "$B$2" || echo "curl failed"
            head -c 400 body.txt | tr -s '\n' ' '; echo; echo
          }
          for i in 1 2; do
            probe GET /health
            probe POST /auth/token -X POST -d "username=zz-diagnostic-not-a-user&password=x"
          done
