# Temporary diagnostic: run the Worker locally (real Workers runtime) against
# the Render DB and capture the error behind the login 500.
name: Diagnose Cloudflare Worker
on:
  push:
    branches: [Cloudflare]
    paths: [.github/workflows/diagnose-worker.yml]
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { ref: Cloudflare }
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Run worker locally and probe login
        env:
          RENDER: ${{ secrets.RENDER_DATABASE_URL }}
        run: |
          export CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE="$RENDER"
          (uv run pywrangler dev --port 8787 > dev.log 2>&1 &)
          for i in $(seq 1 120); do curl -s -o /dev/null localhost:8787/health && break; sleep 3; done
          curl -s -m 120 -o b1.txt -w "health %{http_code}\n" localhost:8787/health
          curl -s -m 120 -o b2.txt -w "login %{http_code}\n" -X POST -d "username=zz-diagnostic-not-a-user&password=x" localhost:8787/auth/token
          sleep 3
          echo "::notice title=health::$(head -c 200 b1.txt)"
          cat b2.txt; echo
          grep -v "^\s*$" dev.log | grep -iv "password\|postgres://\|postgresql://" | tail -c 6000 > tail.txt
          echo "::notice title=login response::$(head -c 300 b2.txt)"
          echo "::notice title=dev log::$(sed ':a;N;$!ba;s/\n/%0A/g' tail.txt | tail -c 3800)"
