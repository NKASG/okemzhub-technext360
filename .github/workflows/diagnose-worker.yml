# Temporary diagnostic: measures Worker response times from outside.
name: Diagnose Cloudflare Worker
on:
  push:
    branches: [Cloudflare]
    paths: [.github/workflows/diagnose-worker.yml]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          W=https://okemzhub-technext360.mohafeezola.workers.dev
          out=""
          for i in 1 2 3 4 5; do
            h=$(curl -s -o /dev/null -w "%{time_total}/%{http_code}" $W/health)
            l=$(curl -s -o /dev/null -w "%{time_total}/%{http_code}" -X POST -d "username=zz-diagnostic-not-a-user&password=x" $W/auth/token)
            p=$(curl -s -o /dev/null -w "%{time_total}/%{http_code}" -H "Authorization: Bearer x" $W/products/)
            out="$out run$i health=$h dblogin=$l authcheck=$p |"
          done
          echo "::notice title=timings (seconds/status)::$out"
          curl -s -D - -o /dev/null $W/health | grep -i "cf-ray\|cf-placement" | tr -d '\r' | tr '\n' ' ' > hdr.txt
          echo "::notice title=headers::$(cat hdr.txt)"
