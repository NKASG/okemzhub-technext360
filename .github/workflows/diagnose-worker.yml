# Temporary diagnostic: run the app's login against Neon with the same driver
# the Worker uses (pg8000) and report any error.
name: Diagnose Cloudflare Worker
on:
  push:
    branches: [Cloudflare]
    paths: [.github/workflows/diagnose-worker.yml]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: Cloudflare }
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - name: Reproduce login
        env:
          NEON: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          pip -q install fastapi "sqlalchemy>=2.0.31" pydantic pydantic-settings bcrypt "python-jose" python-multipart pg8000 httpx
          cat > diag.py <<'PY'
          import os, sys, traceback, ssl
          sys.path.insert(0, "src")
          from sqlalchemy.engine import make_url
          from sqlalchemy.pool import NullPool
          u = make_url(os.environ["NEON"])
          url = u.set(drivername="postgresql+pg8000", query={})
          from app import database
          database.init_engine(url, poolclass=NullPool, connect_args={"ssl_context": ssl.create_default_context()})
          from fastapi.testclient import TestClient
          from app.main import app
          def note(t, m): print(f"::notice title={t}::" + m.replace("\n", "%0A")[:3500])
          c = TestClient(app, raise_server_exceptions=True)
          for name, path, kw in [
              ("bogus login", "/auth/token", dict(method="POST", data={"username": "zz-diagnostic-not-a-user", "password": "x"})),
          ]:
              try:
                  r = c.request(kw.pop("method"), path, **kw)
                  note(name, f"HTTP {r.status_code}: {r.text[:300]}")
              except Exception:
                  note(name + " ERROR", traceback.format_exc()[-3000:])
          PY
          python diag.py
