[project]
name = "okemzhub-technext360"
version = "1.0.0"
description = "Okemzhub inventory & business management (Cloudflare Workers build)"
requires-python = ">=3.13"
# Dependencies bundled into the Cloudflare Worker. Local development still
# uses requirements/local.txt (uvicorn, psycopg2, etc.).
dependencies = [
    "fastapi",
    "sqlalchemy>=2.0.31",
    "pydantic>=2.7.4",
    "pydantic-settings>=2.3.4",
    "bcrypt>=4.0.0",
    "python-jose>=3.3.0",
    "python-multipart>=0.0.9",
    "pg8000",
]

[dependency-groups]
dev = [
    "workers-py",
    "workers-runtime-sdk",
]
