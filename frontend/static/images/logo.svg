  <!-- White S-curve — lower arc -->
  <path d="M 134 92 C 134 116, 118 132, 100 132 C 82 132, 66 116, 66 100 C 66 90, 74 84, 92 82"
        fill="none" stroke="white" stroke-width="13" stroke-linecap="round"/>
